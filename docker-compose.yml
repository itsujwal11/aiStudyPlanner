version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aasa-postgres
    environment:
      POSTGRES_DB: aasa_db
      POSTGRES_USER: aasa_user
      POSTGRES_PASSWORD: aasa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - aasa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aasa_user -d aasa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: aasa-ml
    ports:
      - "8000:8000"
    networks:
      - aasa-network
    volumes:
      # The 30 MB joblib is gitignored, so it is mounted rather than baked into
      # the image. Generate it with `cd ml && python train_model.py`; the
      # service reports modelLoaded:false until it exists, and the backend
      # falls back to evidence-only weakness scoring.
      - ./ml/models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aasa-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aasa_db
      SPRING_DATASOURCE_USERNAME: aasa_user
      SPRING_DATASOURCE_PASSWORD: aasa_password
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in your environment or root .env file}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      ML_WEAKNESS_URL: http://ml-service:8000
    ports:
      - "9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - aasa-network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aasa-frontend
    environment:
      VITE_API_URL: http://localhost:9096/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aasa-network

volumes:
  postgres_data:

networks:
  aasa-network:
    driver: bridge
