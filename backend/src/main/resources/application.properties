spring.application.name=aasa-backend
server.port=9096

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aasa
spring.datasource.username=aasa_user
spring.datasource.password=aasa_password
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.com.aasa=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=backend/backend.log
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=your_super_secret_jwt_key_change_in_production_environment_12345678901234567890
jwt.expiration=86400000

gemini.api.key=AIzaSyBFupP_QViHyFFvuOUolb04oZTkbBedXYU


# Hibernate schema generation: Oracle
# Keep ddl-auto=update, but you may want to switch to 'validate' once schema is stable.


# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept
cors.allow-credentials=true

# File Storage
file.upload.dir=uploads/pdfs
