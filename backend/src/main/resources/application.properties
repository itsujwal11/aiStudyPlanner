spring.application.name=aasa-backend
server.port=${PORT:9096}

# Load ignored local environment files when running from either the repository
# root or the backend directory. Operating-system environment variables still
# take precedence, and missing files are allowed in production.
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aasa_db}
spring.datasource.username=${DB_USERNAME:aasa_user}
spring.datasource.password=${DB_PASSWORD:aasa_password}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.com.aasa=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=backend/backend.log
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_change_in_production_environment_12345678901234567890}
jwt.expiration=86400000

gemini.api.key=${GEMINI_API_KEY:}

# Authentication email and Google Sign-In
google.client-id=${GOOGLE_CLIENT_ID:}
app.mail.enabled=${SMTP_ENABLED:false}
app.mail.from=${SMTP_FROM:no-reply@aasa.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}
app.auth.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.auth.otp.log-codes=${OTP_LOG_CODES:false}

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,https://studyplannerz.vercel.app,https://*.vercel.app
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# File Storage
file.upload.dir=uploads/pdfs
